# Generates GitHub Readme Stats cards as committed SVGs (avoids dead/paused public Vercel).
# @see https://github.com/readme-tools/github-readme-stats-action
# @see https://github.com/anuraghazra/github-readme-stats/issues/4737
name: Update README stats cards

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * 1" # Weekly — Monday 06:20 UTC

permissions:
  contents: write

concurrency:
  group: readme-stats-cards
  cancel-in-progress: true

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=KeithOnyango&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=KeithOnyango&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate WakaTime card
        id: wakatime
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: wakatime
          options: username=XpertKenaTion&layout=compact&theme=tokyonight&hide_border=true
          path: profile/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push SVG cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore(profile): refresh readme stats SVG cards" || exit 0
          git push
